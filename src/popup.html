<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hide Google AI Overviews and Mode</title>
    <style>
      body {
        --bg: #fff;
        --text: #202020;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Inter, Inter-Fallback, Geist, Geist-Fallback, Roboto, Roboto-Fallback, Arial, Arial-Fallback, sans-serif;
        min-width: 15rem;
        padding: .5rem;
        background: var(--bg);
        color: var(--text);
      }
      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.5rem;
      }
      .setting-row span {
        font-size: 1rem;
        text-align: left;
        flex: 1;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 32px;
        height: 18px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #888;
        transition: 0.15s;
        border-radius: 999px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 12px;
        width: 12px;
        left: 3px;
        bottom: 3px;
        background-color: var(--bg);
        transition: 0.15s;
        border-radius: 50%;
      }
      .switch input:checked + .slider {
        background-color: #1a73e8;
      }
      .switch input:focus + .slider {
        padding: 2px;
        box-shadow: 0 0 1px 1px #1a73e8;
      }
      .switch input:checked + .slider:before {
        transform: translateX(13px);
      }
      .header-icons {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 1rem;
      }
      .header-link-icon {
        color: #888;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s, transform 0.1s;
        text-decoration: none;
      }
      .header-link-icon:hover {
        color: var(--text);
        transform: scale(1.1);
      }
      .header-link-icon.star-icon:hover {
        color: #fcde8d;
      }
      .header-link-icon.bmc-icon:hover {
        color: #ffdd00;
      }
      .header-icon {
        width: 22px;
        height: 22px;
        opacity: 1;
        user-select: none;
      }
      .header-logo-link {
        cursor: pointer;
        margin-left: 4px;
      }
      .header-logo-link:hover {
        color: var(--text);
      }
      @media (prefers-color-scheme: dark) {
        body {
          --bg: #202020;
          --text: #fff;
        }
      }
    </style>
  </head>
  <body>

      <span id="aiModeLabel">Hide AI Mode</span>
      <label class="switch">
        <input id="toggleAiMode" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <span id="aiOverviewsLabel">Hide AI Overviews</span>
      <label class="switch">
        <input id="toggleAiOverviews" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>
